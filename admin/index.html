<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e5eb8">
<title>Admin — Bog'cha so'rovnomasi</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#ffffff; --bg2:#f4f7fb; --card:#ffffff;
    --text:#15181d; --muted:#6b7684; --border:#dfe5ee;
    --accent:#1e5eb8; --accent-soft:#eaf1fb;
    --ok:#15803d; --warn:#b45309; --danger:#dc2626;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151a; --bg2:#171b22; --card:#1b1f27;
      --text:#eef1f5; --muted:#96a0ae; --border:#2a313c;
      --accent:#5b9bf0; --accent-soft:#1a2536;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:15px; line-height:1.5;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  .screen{display:none}
  .screen.on{display:block}

  h1{font-size:21px;margin:0 0 4px}
  .lead{color:var(--muted);font-size:14px;margin:0 0 20px}

  .card{background:var(--bg2);border:1px solid var(--border);
        border-radius:var(--radius);padding:18px;margin-bottom:16px}

  label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
  input[type=password]{
    width:100%;font:inherit;font-size:16px;color:var(--text);
    background:var(--card);border:1.5px solid var(--border);
    border-radius:10px;padding:12px 13px;outline:none;
  }
  input:focus{border-color:var(--accent)}
  .btn{display:inline-block;font:inherit;font-size:14px;font-weight:600;
       padding:11px 18px;border-radius:10px;border:0;cursor:pointer;
       background:var(--accent);color:#fff}
  .btn:active{opacity:.85}
  .btn.ghost{background:transparent;color:var(--muted);font-weight:500;
             border:1.5px solid var(--border)}
  .btn.sm{padding:6px 12px;font-size:13px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  tr.item{cursor:pointer}
  tr.item:hover td{background:var(--accent-soft)}
  .muted{color:var(--muted)}
  .badge{display:inline-block;background:var(--accent-soft);color:var(--accent);
         font-size:12px;padding:2px 8px;border-radius:99px}

  .qa{border-bottom:1px solid var(--border);padding:12px 0}
  .qa:last-child{border-bottom:0}
  .qa .q{font-size:13px;color:var(--muted);margin-bottom:4px}
  .qa .a{font-size:14px;white-space:pre-wrap;word-break:break-word}
  .qa .a.empty{color:var(--warn);font-style:italic}

  .err{color:var(--danger);font-size:13px;margin-top:8px}
  .empty-state{text-align:center;color:var(--muted);padding:40px 0}
  .back{background:none;border:0;color:var(--accent);font-size:14px;cursor:pointer;
        padding:0;margin-bottom:14px;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">

<!-- ============ LOGIN ============ -->
<section id="s-login" class="screen on">
  <h1>Admin panel</h1>
  <p class="lead">Bog'cha so'rovnomasi javoblari</p>
  <div class="card">
    <label>Parol</label>
    <input type="password" id="i-pass" autocomplete="current-password" placeholder="Parolni kiriting">
    <div style="margin-top:14px">
      <button class="btn" id="btnLogin">Kirish</button>
    </div>
    <div class="err" id="loginErr"></div>
  </div>
</section>

<!-- ============ RO'YXAT ============ -->
<section id="s-list" class="screen">
  <div class="top">
    <div>
      <h1>So'rovnomalar</h1>
      <p class="lead" style="margin-bottom:0" id="listCount"></p>
    </div>
    <button class="btn ghost sm" id="btnLogout">Chiqish</button>
  </div>
  <div id="listBox"></div>
</section>

<!-- ============ TAFSILOT ============ -->
<section id="s-detail" class="screen">
  <button class="back" id="btnBack">&larr; Ro'yxatga qaytish</button>
  <div class="top">
    <div>
      <h1 id="dName"></h1>
      <p class="lead" style="margin-bottom:0" id="dMeta"></p>
    </div>
    <a class="btn sm" id="btnExport" href="#">⬇ Faylni yuklab olish</a>
  </div>
  <div class="card" id="dOrg"></div>
  <div id="dAnswers"></div>
</section>

</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function show(id){
    document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("on"); });
    $(id).classList.add("on");
    window.scrollTo(0,0);
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }
  function api(path, opts){
    return fetch(path, Object.assign({ credentials: "same-origin" }, opts))
      .then(function(r){ return r.json().then(function(j){ return { status:r.status, body:j }; }); });
  }

  /* ---------- login ---------- */
  $("btnLogin").addEventListener("click", doLogin);
  $("i-pass").addEventListener("keydown", function(e){ if(e.key === "Enter") doLogin(); });

  function doLogin(){
    var pass = $("i-pass").value;
    $("loginErr").textContent = "";
    api("/api/admin/login", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ password: pass })
    }).then(function(res){
      if(res.body && res.body.ok){
        loadList();
      } else if(res.body && res.body.error === "not_configured"){
        $("loginErr").textContent = "Admin panel hali sozlanmagan (ADMIN_PASSWORD yo'q).";
      } else {
        $("loginErr").textContent = "Parol noto'g'ri.";
      }
    }).catch(function(){
      $("loginErr").textContent = "Ulanishda xatolik.";
    });
  }

  $("btnLogout").addEventListener("click", function(){
    api("/api/admin/logout", { method:"POST" }).then(function(){ show("s-login"); });
  });

  /* ---------- ro'yxat ---------- */
  function loadList(){
    api("/api/admin/list").then(function(res){
      if(res.status === 401){ show("s-login"); return; }
      var rows = (res.body && res.body.rows) || [];
      renderList(rows);
      show("s-list");
    });
  }

  function renderList(rows){
    $("listCount").textContent = rows.length + " ta so'rovnoma";
    var box = $("listBox");
    if(!rows.length){
      box.innerHTML = '<div class="empty-state">Hali hech kim to\'ldirmagan.</div>';
      return;
    }
    var html = '<table><thead><tr><th>Bog\'cha</th><th>Telefon</th><th>Sana</th><th>Holat</th></tr></thead><tbody>';
    rows.forEach(function(r){
      var d = new Date(r.created_at);
      html += '<tr class="item" data-id="'+esc(r.id)+'">'
            + '<td>'+esc(r.org_name || "—")+'</td>'
            + '<td>'+esc(r.org_phone || "—")+'</td>'
            + '<td class="muted">'+esc(d.toLocaleDateString("uz-UZ"))+'</td>'
            + '<td><span class="badge">'+r.answered_count+'/'+r.total_count+'</span></td>'
            + '</tr>';
    });
    html += '</tbody></table>';
    box.innerHTML = html;
    box.querySelectorAll(".item").forEach(function(tr){
      tr.addEventListener("click", function(){ loadDetail(tr.dataset.id); });
    });
  }

  /* ---------- tafsilot ---------- */
  function loadDetail(id){
    api("/api/admin/submission?id=" + encodeURIComponent(id)).then(function(res){
      if(res.status === 401){ show("s-login"); return; }
      if(!res.body || !res.body.ok){ return; }
      renderDetail(res.body.row);
      show("s-detail");
    });
  }

  function renderDetail(row){
    $("dName").textContent = row.org_name || "—";
    $("dMeta").textContent = new Date(row.created_at).toLocaleString("uz-UZ")
      + " · " + row.answered_count + "/" + row.total_count + " javob berilgan";
    $("btnExport").href = "/api/admin/export?id=" + encodeURIComponent(row.id);

    $("dOrg").innerHTML =
      '<div><b>Turi:</b> ' + esc(row.org_type || "—") + '</div>' +
      '<div><b>Manzil:</b> ' + esc(row.org_addr || "—") + '</div>' +
      '<div><b>Telefon:</b> ' + esc(row.org_phone || "—") + '</div>' +
      '<div><b>Rahbar:</b> ' + esc(row.org_boss || "—") + '</div>';

    var answers = Array.isArray(row.answers) ? row.answers : [];
    var html = "";
    answers.forEach(function(a){
      var ans = a.a && String(a.a).trim();
      html += '<div class="qa"><div class="q">' + (a.n || "?") + '. ' + esc(a.q || "") + '</div>'
            + '<div class="a' + (ans ? "" : " empty") + '">' + esc(ans || "javob berilmagan") + '</div></div>';
    });
    $("dAnswers").innerHTML = html;
  }

  $("btnBack").addEventListener("click", loadList);

  /* ---------- boshlash: sessiya bormi tekshiramiz ---------- */
  api("/api/admin/list").then(function(res){
    if(res.status === 200 && res.body && res.body.ok){
      renderList(res.body.rows || []);
      show("s-list");
    }
  });
})();
</script>
</body>
</html>
